name: advanced_to_do_list
description: A clean Flutter UI for onboarding and sign-in screens.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_islamic_icons: ^1.0.2
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.3
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1


dev_dependencies:
 

flutter_native_splash:
    color: "#2563EB" 
    image: "assets/images/app_icon2.jpg" 
    
    android_12:
      color: "#2563EB"
      image: "assets/images/app_icon2.jpg"
    ios: true
    android: true
  
flutter_test:
    sdk: flutter
flutter_lints: ^3.0.0
flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon2.jpg"
  min_sdk_android: 21


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding illustartion.png
